[project]
name = "algorithm-registry"
version = "0.1.0"
description = "Generic, type-safe Strategy + Registry for interchangeable algorithms."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algorithm_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
addopts = "--cov=algorithm_registry --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["algorithm_registry"]

[tool.mypy]
strict = true
mypy_path = "examples"
files = ["src", "tests", "examples"]
